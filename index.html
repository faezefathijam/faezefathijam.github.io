<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faeze (Fae) Fathijam | Curriculum Vitae</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Sans:wght@600;700&display=swap" rel="stylesheet">

<style>
/* ======================
   THEME VARIABLES
====================== */
:root{
  --bg:#0b1220;
  --card:#0f172a;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --accent:#38bdf8;
  --border:rgba(148,163,184,.25);
  --radius:18px;
}

[data-theme="light"]{
  --bg:#f6f8fc;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --accent:#0284c7;
  --border:rgba(15,23,42,.15);
}

/* ======================
   BASE STYLES
====================== */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,system-ui,sans-serif;
  background:radial-gradient(circle at top, rgba(56,189,248,.12), transparent 55%), var(--bg);
  color:var(--text);
  line-height:1.75;
  transition:background .3s,color .3s;
}
a{color:var(--accent);text-decoration:none}

/* ======================
   NAVBAR
====================== */
nav{
  position:sticky;top:0;z-index:10;
  background:rgba(11,18,32,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
[data-theme="light"] nav{
  background:rgba(255,255,255,.85);
}

.nav-inner{
  max-width:1200px;
  margin:auto;
  padding:.9rem 1rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:.6rem;
}

.nav-name{
  font-family:"DM Sans",sans-serif;
  font-size:.8rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
}

.nav-links{
  display:flex;
  flex-wrap:wrap;
  gap:.4rem;
}

.nav-links a{
  font-size:.72rem;
  padding:.35rem .9rem;
  border-radius:999px;
  color:var(--muted);
}
.nav-links a:hover{
  background:rgba(56,189,248,.18);
  color:var(--text);
}

/* ======================
   THEME TOGGLE
====================== */
.toggle{
  cursor:pointer;
  border:1px solid var(--border);
  border-radius:999px;
  padding:.35rem .7rem;
  font-size:.75rem;
  background:var(--card);
}

/* ======================
   LAYOUT
====================== */
section{
  max-width:1100px;
  margin:2.4rem auto;
  padding:0 1rem;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:2.2rem;
  margin-bottom:2.4rem;
  transition:background .3s;
}

.section-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:1.3rem;
}

.item-box{
  border:1px solid rgba(56,189,248,.35);
  border-radius:14px;
  padding:1.5rem 1.7rem;
  background:linear-gradient(180deg, rgba(15,23,42,.85), rgba(15,23,42,.55));
}
[data-theme="light"] .item-box{
  background:linear-gradient(180deg,#fff,#f8fafc);
}

/* ======================
   HERO
====================== */
.hero{
  text-align:center;
  max-width:720px;
  margin:3rem auto;
  box-shadow:0 40px 80px rgba(0,0,0,.35);
}

.hero img{
  width:220px;
  height:220px;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:1.6rem;
}

h1{
  font-family:"DM Sans",sans-serif;
  font-size:2.4rem;
}

.hero-subtitle{
  font-size:.75rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
  margin:.7rem 0 1.1rem;
}

.meta{
  font-size:.9rem;
  color:var(--muted);
}

.hero-links{
  display:flex;
  justify-content:center;
  gap:.7rem;
  flex-wrap:wrap;
  margin-top:1.4rem;
}

.btn{
  padding:.5rem 1.15rem;
  border-radius:999px;
  font-size:.85rem;
  border:1px solid rgba(56,189,248,.45);
  background:transparent;
  color:var(--text);
}
.btn.primary{
  background:linear-gradient(135deg,#38bdf8,#22c55e);
  border:none;
  color:#041014;
}

/* ======================
   HEADINGS & TEXT
====================== */
h2{
  font-family:"DM Sans",sans-serif;
  font-size:.85rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:1.2rem;
}
h3{font-size:1.05rem;margin-bottom:.4rem}
ul{margin-left:1.4rem}
li{margin-bottom:.6rem}

/* ======================
   MOBILE OPTIMIZATION
====================== */
@media(max-width:640px){
  h1{font-size:1.9rem}
  .hero img{width:180px;height:180px}
  .card{padding:1.6rem}
  section{margin:1.6rem auto}
}

/* ======================
   FOOTER
====================== */
footer{
  text-align:center;
  font-size:.75rem;
  color:var(--muted);
  margin:3rem 0 1.5rem;
}
</style>
</head>

<body>

<nav>
  <div class="nav-inner">
    <div class="nav-name">Faeze Fathijam</div>
    <div class="nav-links">
      <a href="#education">Education</a>
      <a href="#skills">Skills</a>
      <a href="#research">Research</a>
      <a href="#publications">Publications</a>
      <a href="#experience">Experience</a>
      <button class="toggle" onclick="toggleTheme()">🌙 / ☀️</button>
    </div>
  </div>
</nav>

<section class="card hero">
  <img src="faeze.jpg" alt="Faeze Fathijam">
  <h1>Faeze (Fae) Fathijam</h1>
  <p class="hero-subtitle">
    Transportation Engineering · Data Science · Machine Learning
  </p>
  <p class="meta">
    State College, PA · fkf5073@psu.edu
  </p>
  <div class="hero-links">
    <a class="btn primary" href="Faeze-Fathi-Jam-CV.pdf" target="_blank">Download CV</a>
    <a class="btn" href="https://linkedin.com/in/faeze-fathi-jam" target="_blank">LinkedIn</a>
    <a class="btn" href="https://github.com/faezefathijam" target="_blank">GitHub</a>
  </div>
</section>

<footer>© 2026 Faeze (Fae) Fathijam</footer>

<script>
function toggleTheme(){
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
}
const saved = localStorage.getItem("theme");
if(saved){
  document.documentElement.setAttribute("data-theme", saved);
}
</script>

</body>
</html>
